# Fold-proof build: single-line steps only, the whole app inside one
# base64 string. v6: the clock reads the frame at the EAR (device
# presentation timestamp), cancelling sink and Bluetooth latency.
name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Unpack the app source
        run: echo  | base64 -di | tar xz
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Build debug APK
        run: cd MoS-Reader-Android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MoS-Reader-APK
          path: MoS-Reader-Android/app/build/outputs/apk/debug/app-debug.apk

