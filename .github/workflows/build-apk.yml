name: Build APK
on:
  push: null
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if only the zip was uploaded
        run: "if [ -f MoS-Reader-Android.zip ]; then unzip -o MoS-Reader-Android.zip; fi
if [ -d MoS-Reader-Android ]; then echo \"DIR=MoS-Reader-Android\" >> $GITHUB_ENV; else echo \"DIR=.\" >> $GITHUB_ENV; fi
"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: "cd \"$DIR\" && gradle assembleDebug"
      - uses: actions/upload-artifact@v4
        with:
          name: MoS-Reader-APK
          path: **/app/build/outputs/apk/debug/app-debug.apk
